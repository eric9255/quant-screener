name: 高盛量化終端_每日數據更新

on:
  schedule:
    - cron: '30 6 * * 1-5'
  
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: 📥 下載目前的儲存庫檔案
        uses: actions/checkout@v4  # 🌟 升級為 v4

      - name: 🐍 安裝 Python 環境
        uses: actions/setup-python@v5  # 🌟 升級為 v5
        with:
          python-version: '3.x'

      - name: ⚙️ 執行高盛量化爬蟲腳本
        run: python update_data.py

      - name: 💾 自動 Commit 並更新網頁資料
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Goldman Quant Bot"
          git add stocks_data.json
          git commit -m "🤖 自動更新：台股每日收盤量化數據" || exit 0
          git push
