<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高盛級量化 AI 選股終端 3.0 (全自動化版)</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .goldman-gold { color: #bf953f; }
        .bg-goldman { background-color: #bf953f; }
        .loader { border-top-color: #bf953f; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-8">

    <div class="max-w-6xl mx-auto">
        <!-- 標題與 API Key 設定區 -->
        <header class="mb-8 border-b border-gray-700 pb-4 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-bold goldman-gold tracking-wider">QUANT FACTOR + GEMINI AI</h1>
                <p class="text-sm text-gray-400 mt-2">高盛專屬經理人 - 每日自動抓取收盤價 + AI 推理引擎</p>
                <p id="lastUpdateTime" class="text-xs text-green-400 mt-1">🔄 系統狀態：等待同步最新數據中...</p>
            </div>
            <div class="flex items-center space-x-2">
                <input type="password" id="geminiApiKey" placeholder="請輸入 Gemini API Key" class="px-3 py-2 bg-gray-800 border border-gray-600 rounded text-sm text-white focus:outline-none focus:border-yellow-500 w-64">
                <button onclick="checkApiKey()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded text-sm transition">驗證密鑰</button>
            </div>
        </header>

        <!-- AI 分析報告顯示區 (預設隱藏) -->
        <div id="aiReportPanel" class="hidden mb-6 p-6 bg-gray-800 rounded-lg border-l-4 border-yellow-500 shadow-2xl relative">
            <button onclick="closeAiPanel()" class="absolute top-2 right-4 text-gray-400 hover:text-white text-xl">&times;</button>
            <h2 class="text-xl font-bold text-white mb-2 flex items-center">
                <span class="mr-2">🤖 高盛 AI 投資決策報告</span>
                <span id="aiStockName" class="text-yellow-400"></span>
            </h2>
            <div id="aiReportContent" class="text-gray-300 leading-relaxed text-sm">
                <!-- AI 報告將生成於此 -->
            </div>
        </div>

        <!-- 數據表格 -->
        <div class="overflow-x-auto bg-gray-800 rounded-lg shadow-xl border border-gray-700">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-900 text-gray-300 text-sm uppercase tracking-wide border-b border-gray-700">
                        <th class="p-4">代號</th>
                        <th class="p-4">企業名稱</th>
                        <th class="p-4">本日收盤價</th>
                        <th class="p-4">量化總分</th>
                        <th class="p-4">系統判定</th>
                        <th class="p-4 text-center">AI 深度分析</th>
                    </tr>
                </thead>
                <tbody id="stockTableBody" class="text-sm">
                    <tr><td colspan="6" class="p-8 text-center text-gray-400"><div class="inline-block loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-6 w-6 mr-3"></div> 正在連線讀取今日最新台股數據...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let stocksData =[]; // 準備接收來自 GitHub Actions 的真實數據

        function calculateScore(stock) { return (stock.fundamental * 0.2 + stock.chip * 0.4 + stock.technical * 0.4).toFixed(1); }

        function renderTable() {
            const tbody = document.getElementById('stockTableBody');
            tbody.innerHTML = ''; 

            if(stocksData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-red-400">尚未讀取到數據。請確認 GitHub Actions 是否已成功生成 stocks_data.json！</td></tr>';
                return;
            }

            stocksData.forEach(stock => {
                const totalScore = calculateScore(stock);
                let badge = totalScore >= 90 ? '<span class="px-2 py-1 bg-red-900 text-red-200 rounded text-xs font-bold">強烈買進</span>' :
                            totalScore >= 80 ? '<span class="px-2 py-1 bg-green-900 text-green-200 rounded text-xs font-bold">偏多佈局</span>' :
                            '<span class="px-2 py-1 bg-gray-700 text-gray-400 rounded text-xs font-bold">觀望</span>';

                const stockJson = JSON.stringify({...stock, totalScore}).replace(/"/g, '&quot;');

                const tr = document.createElement('tr');
                tr.className = 'border-b border-gray-700 hover:bg-gray-750 transition duration-150';
                tr.innerHTML = `
                    <td class="p-4 font-bold text-gray-300">${stock.id}</td>
                    <td class="p-4 font-bold text-white">${stock.name}</td>
                    <td class="p-4 text-green-400 font-medium">${stock.price}</td>
                    <td class="p-4 font-bold ${totalScore >= 80 ? 'text-yellow-400' : 'text-gray-400'}">${totalScore}</td>
                    <td class="p-4">${badge}</td>
                    <td class="p-4 text-center">
                        <button onclick="askGeminiAI('${stockJson}')" class="px-3 py-1 bg-blue-600 hover:bg-blue-500 rounded text-white text-xs font-medium transition shadow flex items-center justify-center mx-auto">
                            ✨ AI 診斷
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            
            // 更新網頁上的時間顯示
            const now = new Date();
            document.getElementById('lastUpdateTime').innerText = `🔄 系統狀態：已成功同步今日最新數據 (更新時間: ${now.toLocaleTimeString()})`;
        }

        // 🚀 核心升級：非同步自動抓取 json 檔案
        async function loadStockData() {
            try {
                // 在網址後方加上時間戳記，防止瀏覽器讀取到舊的暫存檔 (Cache)
                const response = await fetch('stocks_data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error("找不到檔案");
                
                stocksData = await response.json();
                renderTable();
            } catch (error) {
                console.error("抓取失敗:", error);
                document.getElementById('stockTableBody').innerHTML = '<tr><td colspan="6" class="p-4 text-center text-red-400">⚠ 找不到 stocks_data.json！請先到 GitHub Actions 點擊「Run workflow」手動執行一次爬蟲機器人。</td></tr>';
            }
        }

        // 網頁一打開，就自動去載入數據
        loadStockData();

        function checkApiKey() {
            const key = document.getElementById('geminiApiKey').value;
            if(key.length > 20) alert("密鑰格式已確認！可以開始呼叫 AI 診斷。");
            else alert("請輸入有效的 Gemini API Key！");
        }

        function closeAiPanel() { document.getElementById('aiReportPanel').classList.add('hidden'); }

        async function askGeminiAI(stockJsonStr) {
            const apiKey = document.getElementById('geminiApiKey').value;
            if(!apiKey) { alert("請先在右上角輸入您的 Gemini API Key！"); return; }

            const stock = JSON.parse(stockJsonStr);
            const panel = document.getElementById('aiReportPanel');
            const content = document.getElementById('aiReportContent');
            const titleName = document.getElementById('aiStockName');
            
            panel.classList.remove('hidden');
            titleName.innerText = `(${stock.id} ${stock.name})`;
            content.innerHTML = `<div class="flex items-center"><div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-6 w-6 mr-3"></div> 高盛 AI 正在深度運算今日盤後數據，請稍候...</div>`;

            const prompt = `你現在是高盛證券的台股王牌分析師。
            請根據今天剛收盤的最新量化數據，為這檔股票寫一份約 100 字以內的精簡操作建議。
            - 股票名稱：${stock.name}
            - 本日收盤價：${stock.price}
            - 基本面分數：${stock.fundamental}/100
            - 籌碼面分數：${stock.chip}/100
            - 技術面分數：${stock.technical}/100
            - 量化總分：${stock.totalScore}/100
            請用繁體中文回答，語氣要專業、犀利。告訴投資人這個分數代表什麼意義，該買進、觀望還是獲利了結。`;

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts:[{ text: prompt }] }] })
                });

                const data = await response.json();
                if(data.error) { content.innerHTML = `<span class="text-red-400">API 錯誤：${data.error.message}</span>`; return; }
                content.innerHTML = data.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');

            } catch (error) {
                content.innerHTML = `<span class="text-red-400">連線失敗，請檢查網路或 API Key 權限。</span>`;
            }
        }
    </script>
</body>
</html>
</html>
