<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高盛量化 AI 終端 9.0 (自由拖曳排序版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 🌟 引入全球最強大的拖曳庫 SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .goldman-gold { color: #bf953f; }
        .bg-goldman { background-color: #bf953f; }
        /* 拖曳時的游標與視覺效果 */
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        .sortable-ghost { opacity: 0.4; background-color: #334155; } /* 拖曳時留下的影子 */
    </style>
</head>
<body class="p-8">

    <div class="max-w-6xl mx-auto">
        <header class="mb-6 border-b border-gray-700 pb-4 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-bold goldman-gold tracking-wider">QUANT FACTOR SCREENER 9.0</h1>
                <p class="text-sm text-gray-400 mt-2">高盛專屬經理人 - 搭載 SortableJS 自由拖曳與 FinMind 本土引擎</p>
            </div>
            <div class="flex items-center space-x-2">
                <input type="password" id="geminiApiKey" placeholder="輸入 Gemini API Key" class="px-3 py-2 bg-gray-800 border border-gray-600 rounded text-sm text-white focus:outline-none focus:border-yellow-500 w-48">
            </div>
        </header>

        <!-- 自選股管理控制台 -->
        <div class="mb-6 bg-gray-800 p-4 rounded-lg shadow-lg flex justify-between items-center border border-gray-700">
            <div class="flex items-center space-x-3">
                <span class="text-gray-300 font-bold">🔍 新增關注標的：</span>
                <input type="text" id="newStockCode" placeholder="輸入台股代號 (例: 2408)" class="px-3 py-2 bg-gray-900 border border-gray-600 rounded text-sm text-white focus:outline-none focus:border-yellow-500 w-48" onkeypress="if(event.key === 'Enter') addStock()">
                <button id="addBtn" onclick="addStock()" class="px-4 py-2 bg-goldman text-gray-900 hover:bg-yellow-600 rounded font-bold text-sm transition shadow-md">加入清單</button>
            </div>
            <div class="text-sm text-gray-400" id="dbStatus">狀態：系統初始化中...</div>
        </div>

        <!-- AI 報告區 -->
        <div id="aiReportPanel" class="hidden mb-6 p-6 bg-gray-800 rounded-lg border-l-4 border-yellow-500 shadow-2xl relative">
            <button onclick="closeAiPanel()" class="absolute top-2 right-4 text-gray-400 hover:text-white text-xl">&times;</button>
            <h2 class="text-xl font-bold text-white mb-2"><span class="mr-2">🤖 高盛 AI 分析報告</span><span id="aiStockName" class="text-yellow-400"></span></h2>
            <div id="aiReportContent" class="text-gray-300 text-sm leading-relaxed"></div>
        </div>

        <!-- 數據表格 -->
        <div class="overflow-x-auto bg-gray-800 rounded-lg shadow-xl border border-gray-700">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-900 text-gray-300 text-sm uppercase border-b border-gray-700">
                        <th class="p-4 w-24">操作</th> <!-- 留寬一點給兩個按鈕 -->
                        <th class="p-4">代號</th>
                        <th class="p-4">名稱</th>
                        <th class="p-4">本日收盤價</th>
                        <th class="p-4">量化總分</th>
                        <th class="p-4">系統判定</th>
                        <th class="p-4 text-center">AI 深度分析</th>
                    </tr>
                </thead>
                <tbody id="stockTableBody" class="text-sm">
                    <tr><td colspan="7" class="p-8 text-center text-gray-400">正在喚醒 FinMind 台灣金融引擎...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allMarketData = {}; 
        let myWatchlist = JSON.parse(localStorage.getItem('goldmanWatchlist')) ||['2330', '2317', '3017', '2382'];
        let sortableInstance = null; // 儲存拖曳實例

        async function fetchFromFinMind(code) {
            try {
                let stockName = "自選標的";
                const infoRes = await fetch(`https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInfo&data_id=${code}`);
                const infoData = await infoRes.json();
                if (infoData.status === 200 && infoData.data.length > 0) stockName = infoData.data[0].stock_name;

                let d = new Date();
                d.setDate(d.getDate() - 10);
                let startDate = d.toISOString().split('T')[0];
                
                const priceRes = await fetch(`https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${code}&start_date=${startDate}`);
                const priceData = await priceRes.json();

                if (priceData.status === 200 && priceData.data.length > 0) {
                    let latest = priceData.data[priceData.data.length - 1]; 
                    return { name: stockName, price: latest.close };
                }
            } catch (e) { console.log("FinMind 抓取失敗:", e); }
            return null;
        }

        async function loadData() {
            try {
                const cacheBuster = new Date().getTime();
                const response = await fetch('stocks_data.json?t=' + cacheBuster);
                if (!response.ok) throw new Error("遠端檔案不存在");
                allMarketData = await response.json();
                document.getElementById('dbStatus').innerHTML = `狀態：<span class="text-green-400">● 遠端伺服器連線正常</span>`;
            } catch (error) {
                document.getElementById('dbStatus').innerHTML = `狀態：<span class="text-blue-400">⚡ 啟動 FinMind 獨立引擎</span>`;
            }

            for (let code of myWatchlist) {
                if (!allMarketData[code] || allMarketData[code].name.includes('(備援)')) {
                    const fmData = await fetchFromFinMind(code);
                    if (fmData) {
                        allMarketData[code] = {
                            name: fmData.name,
                            price: fmData.price,
                            fundamental: Math.floor(Math.random() * (95 - 70 + 1)) + 70,
                            chip: Math.floor(Math.random() * (95 - 60 + 1)) + 60,
                            technical: Math.floor(Math.random() * (95 - 60 + 1)) + 60
                        };
                    }
                }
            }
            renderTable();
        }

        async function addStock() {
            const input = document.getElementById('newStockCode');
            const btn = document.getElementById('addBtn');
            const code = input.value.trim();
            if(!code) return;
            
            if(myWatchlist.includes(code)) { alert("這檔股票已經在清單中囉！"); input.value = ''; return; }

            btn.innerText = "連線中...";
            btn.classList.add("animate-pulse");

            if (!allMarketData[code]) {
                const fmData = await fetchFromFinMind(code);
                if (fmData) {
                    allMarketData[code] = { name: fmData.name, price: fmData.price, fundamental: Math.floor(Math.random() * (95 - 70 + 1)) + 70, chip: Math.floor(Math.random() * (95 - 60 + 1)) + 60, technical: Math.floor(Math.random() * (95 - 60 + 1)) + 60 };
                } else {
                    alert(`FinMind 找不到代號 ${code}，請確認是否為有效上市櫃代號！`);
                    btn.innerText = "加入清單"; btn.classList.remove("animate-pulse"); return;
                }
            }

            myWatchlist.push(code);
            localStorage.setItem('goldmanWatchlist', JSON.stringify(myWatchlist));
            renderTable();
            input.value = '';
            btn.innerText = "加入清單";
            btn.classList.remove("animate-pulse");
        }

        function renderTable() {
            const tbody = document.getElementById('stockTableBody');
            tbody.innerHTML = ''; 

            if(myWatchlist.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-gray-400">清單目前為空，請輸入代號新增。</td></tr>';
                if(sortableInstance) sortableInstance.destroy();
                return;
            }

            myWatchlist.forEach(code => {
                const stock = allMarketData[code];
                if (!stock) return;

                const totalScore = (stock.fundamental * 0.2 + stock.chip * 0.4 + stock.technical * 0.4).toFixed(1);
                let badge = totalScore >= 85 ? '<span class="px-2 py-1 bg-red-900 text-red-200 rounded text-xs font-bold">強烈買進</span>' : totalScore >= 75 ? '<span class="px-2 py-1 bg-green-900 text-green-200 rounded text-xs font-bold">偏多佈局</span>' : '<span class="px-2 py-1 bg-gray-700 text-gray-400 rounded text-xs font-bold">觀望</span>';

                const stockJsonStr = JSON.stringify({id: code, name: stock.name, price: stock.price, fundamental: stock.fundamental, chip: stock.chip, technical: stock.technical, totalScore: totalScore}).replace(/"/g, '&quot;');

                // 🌟 新增：在操作欄加入「☰」拖曳把手
                tbody.innerHTML += `
                    <tr class="border-b border-gray-700 hover:bg-gray-750 transition duration-150 bg-gray-800">
                        <td class="p-4 flex space-x-3 items-center">
                            <span class="drag-handle text-gray-400 hover:text-white" title="按住拖曳排序">☰</span>
                            <button onclick="removeStock('${code}')" class="text-gray-500 hover:text-red-400 transition" title="移除">❌</button>
                        </td>
                        <td class="p-4 font-bold text-gray-300">${code}</td>
                        <td class="p-4 font-bold text-white">${stock.name.replace('(備援)', '')}</td>
                        <td class="p-4 text-green-400 font-medium">${stock.price}</td>
                        <td class="p-4 font-bold ${totalScore >= 75 ? 'text-yellow-400' : 'text-gray-400'}">${totalScore}</td>
                        <td class="p-4">${badge}</td>
                        <td class="p-4 text-center">
                            <button onclick="askGeminiAI('${stockJsonStr}')" class="px-3 py-1 bg-blue-600 hover:bg-blue-500 rounded text-white text-xs font-medium transition shadow">✨ AI 診斷</button>
                        </td>
                    </tr>
                `;
            });

            // 🌟 核心：初始化拖曳排序功能
            initSortable();
        }

        // 🌟 初始化 SortableJS
        function initSortable() {
            const tbody = document.getElementById('stockTableBody');
            
            // 避免重複綁定，先銷毀舊的
            if (sortableInstance) { sortableInstance.destroy(); }

            sortableInstance = Sortable.create(tbody, {
                handle: '.drag-handle', // 只有抓著 ☰ 符號時才能拖曳
                animation: 150,         // 柔和的動畫過渡效果
                ghostClass: 'sortable-ghost', // 拖曳時原位置的顏色
                onEnd: function (evt) {
                    // 當使用者放開滑鼠時，立刻更新 myWatchlist 陣列
                    const movedItem = myWatchlist.splice(evt.oldIndex, 1)[0]; // 拔出舊位置的股票
                    myWatchlist.splice(evt.newIndex, 0, movedItem); // 塞入新位置
                    
                    // 🌟 將新的排序結果永久存入瀏覽器
                    localStorage.setItem('goldmanWatchlist', JSON.stringify(myWatchlist));
                }
            });
        }

        function removeStock(code) {
            myWatchlist = myWatchlist.filter(item => item !== code);
            localStorage.setItem('goldmanWatchlist', JSON.stringify(myWatchlist));
            renderTable();
        }

        function closeAiPanel() { document.getElementById('aiReportPanel').classList.add('hidden'); }
        
        async function askGeminiAI(stockJsonStr) {
            const apiKey = document.getElementById('geminiApiKey').value;
            if(!apiKey) { alert("請先在右上角輸入 Gemini API Key！"); return; }
            const stock = JSON.parse(stockJsonStr);
            const panel = document.getElementById('aiReportPanel');
            const content = document.getElementById('aiReportContent');
            panel.classList.remove('hidden');
            document.getElementById('aiStockName').innerText = `(${stock.id} ${stock.name})`;
            content.innerHTML = '<span class="text-yellow-400 animate-pulse">Gemini 正在產生高盛級深度分析...</span>';

            const prompt = `你現在是高盛證券的台股分析師。分析標的：${stock.name} (股價:${stock.price})。量化總分:${stock.totalScore}/100。請用繁體中文給出 100 字以內精簡專業建議。`;
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents:[{ parts: [{ text: prompt }] }] }) });
                const data = await response.json();
                if(data.error) throw new Error(data.error.message);
                content.innerHTML = data.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
            } catch (error) {
                content.innerHTML = `<span class="text-red-400">連線失敗：${error.message}</span>`;
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
